<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>IA - O Guardião</title>
    <!-- Desafio Hacker: Biblioteca de Confetes -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #121212; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { background: #1e1e1e; padding: 20px; border-radius: 12px; max-width: 500px; width: 100%; box-shadow: 0 5px 20px rgba(0,0,0,0.5); margin-bottom: 20px; }
        input { padding: 12px; width: 95%; margin-bottom: 15px; border-radius: 8px; border: none; background: #333; color: white; }
        button { padding: 12px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; }
        .btn-green { background: #28a745; width: 100%; }
        .btn-gold { background: #ff9800; margin-bottom: 10px; }
        .chat-box { height: 350px; overflow-y: auto; background: #0a0a0a; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .msg { padding: 10px; margin-bottom: 10px; border-radius: 8px; max-width: 85%; }
        .msg.bot { background: #444; align-self: flex-start; }
        .msg.user { background: #007bff; margin-left: auto; text-align: right; }
        .ranking-item { padding: 10px; border-bottom: 1px solid #333; font-size: 1.1em; }
        .ranking-item:nth-child(1) { color: gold; font-weight: bold; }
    </style>
</head>
<body>

    <h2 style="color: #ff9800;">🧙‍♂️ O Mestre das Charadas</h2>

    <!-- TELA 1: LOGIN -->
    <div class="container" id="tela-login">
        <h3>Qual o seu Nickname, viajante?</h3>
        <input type="text" id="input-nick" placeholder="Digite seu nome para guardar seu XP...">
        <button class="btn-green" onclick="entrarJogo()">Começar Aventura</button>
    </div>

    <!-- TELA 2: O JOGO E RANKING -->
    <div class="container" id="tela-jogo" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <span id="nome-jogador" style="font-weight: bold;"></span>
            <button class="btn-gold" onclick="verRanking()">🏆 Ver Ranking Global</button>
        </div>

        <div class="chat-box" id="historico">
            <div class="msg bot">Guardião: Eu sou o Mestre. Diga 'Olá' e eu te darei uma charada. Acerte e ganhe XP!</div>
        </div>

        <div style="display: flex; gap: 10px;">
            <input type="text" id="pergunta" placeholder="Sua resposta..." onkeypress="if(event.key === 'Enter') enviar()">
            <button class="btn-green" style="width: auto;" onclick="enviar()">Enviar</button>
        </div>
    </div>

    <!-- MODAL DE RANKING -->
    <div class="container" id="tela-ranking" style="display: none; background: #2b2b2b;">
        <h3 style="text-align: center; color: gold;">🏆 Top 10 - Hall da Fama</h3>
        <div id="lista-ranking"></div>
        <button class="btn-green" style="margin-top: 15px; background: #dc3545;" onclick="fecharRanking()">Voltar ao Jogo</button>
    </div>

    <script>
        // O LINK DO SEU RENDER CORRIGIDO AQUI:
        const URL_API = "https://api-agente-ia-1-kem6.onrender.com";
        let nickJogador = "";

        function entrarJogo() {
            nickJogador = document.getElementById("input-nick").value.trim();
            if (!nickJogador) return alert("Digite um nome!");
            
            document.getElementById("tela-login").style.display = "none";
            document.getElementById("tela-jogo").style.display = "block";
            document.getElementById("nome-jogador").innerText = `🎮 Jogador: ${nickJogador}`;
        }

        async function enviar() {
            const input = document.getElementById("pergunta");
            const texto = input.value.trim();
            if (!texto) return;

            const historico = document.getElementById("historico");
            historico.innerHTML += `<div class="msg user">${texto}</div>`;
            input.value = "";
            historico.scrollTop = historico.scrollHeight;

            try {
                // Manda a pergunta E o nickname pro backend
                const res = await fetch(`${URL_API}/api/chat`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ pergunta: texto, nickname: nickJogador })
                });
                
                const dados = await res.json();
                historico.innerHTML += `<div class="msg bot">Guardião: ${dados.resposta}</div>`;
                historico.scrollTop = historico.scrollHeight;

                // DESAFIO HACKER: Estourar Confete se a IA disser "Acertou" ou "Parabéns"
                const respostaLower = dados.resposta.toLowerCase();
                if (respostaLower.includes("acertou") || respostaLower.includes("parabéns")) {
                    confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
                }

            } catch (e) {
                historico.innerHTML += `<div class="msg bot" style="color: red;">[Erro de Conexão]</div>`;
            }
        }

        async function verRanking() {
            document.getElementById("tela-jogo").style.display = "none";
            document.getElementById("tela-ranking").style.display = "block";
            const lista = document.getElementById("lista-ranking");
            lista.innerHTML = "Consultando Banco de Dados...";

            try {
                const res = await fetch(`${URL_API}/api/ranking`);
                const jogadores = await res.json();
                
                // Desenha a lista. O primeiro ganha medalha!
                lista.innerHTML = jogadores.map((j, i) => {
                    let icone = i === 0 ? "🥇" : (i === 1 ? "🥈" : (i === 2 ? "🥉" : ""));
                    return `<div class="ranking-item">${icone} <b>${j.titulo}</b> <span>(${j.xp} XP)</span></div>`;
                }).join("");
            } catch (e) {
                lista.innerHTML = "Falha ao ler ranking do Mongo.";
            }
        }

        function fecharRanking() {
            document.getElementById("tela-ranking").style.display = "none";
            document.getElementById("tela-jogo").style.display = "block";
        }
    </script>
</body>
</html>
