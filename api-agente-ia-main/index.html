<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>IA - Área Segura SaaS</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #121212; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { background: #1e1e1e; padding: 20px; border-radius: 12px; max-width: 500px; width: 100%; box-shadow: 0 5px 20px rgba(0,0,0,0.5); margin-bottom: 20px; }
        input { padding: 12px; width: 93%; margin-bottom: 15px; border-radius: 8px; border: none; background: #333; color: white; }
        button { padding: 12px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; width: 100%; margin-bottom: 10px; }
        .btn-green { background: #28a745; }
        .btn-blue { background: #007bff; }
        .btn-red { background: #dc3545; }
        .btn-gold { background: #ff9800; }
        .chat-box { height: 350px; overflow-y: auto; background: #0a0a0a; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .msg { padding: 10px; margin-bottom: 10px; border-radius: 8px; max-width: 85%; }
        .msg.bot { background: #444; align-self: flex-start; }
        .msg.user { background: #007bff; margin-left: auto; text-align: right; }
        .ranking-item { padding: 10px; border-bottom: 1px solid #333; }
        .header-top { display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <h2 style="color: #007bff;">🔐 Cofre de Usuários (SaaS)</h2>

    <!-- TELA DE LOGIN / CADASTRO -->
    <div class="container" id="tela-login">
        <h3>Acesso Restrito</h3>
        <input type="text" id="reg-nome" placeholder="Seu Nickname (Só para cadastro)" />
        <input type="email" id="log-email" placeholder="Seu E-mail" />
        <input type="password" id="log-senha" placeholder="Sua Senha" />
        
        <button class="btn-green" onclick="fazerLogin()">Entrar (Login)</button>
        <button class="btn-blue" onclick="fazerCadastro()">Criar Conta Nova</button>
        <p id="msg-erro" style="color: red; text-align: center; font-size: 14px;"></p>
    </div>

    <!-- TELA DO JOGO (SÓ ENTRA COM CRACHÁ JWT) -->
    <div class="container" id="tela-jogo" style="display: none;">
        <div class="header-top">
            <span id="nome-jogador" style="font-weight: bold; color: #28a745;"></span>
            <div>
                <button class="btn-gold" style="width: auto; padding: 8px;" onclick="verRanking()">🏆 Ranking</button>
                <button class="btn-red" style="width: auto; padding: 8px;" onclick="sairDaConta()">Sair</button>
            </div>
        </div>

        <div class="chat-box" id="historico">
            <div class="msg bot">Guardião: Crachá JWT aceito. Pode mandar sua charada!</div>
        </div>

        <div style="display: flex; gap: 10px;">
            <input type="text" id="pergunta" placeholder="Sua resposta..." onkeypress="if(event.key === 'Enter') enviar()" style="width: 75%;">
            <button class="btn-green" style="width: 25%;" onclick="enviar()">Enviar</button>
        </div>
    </div>

    <!-- TELA DE RANKING -->
    <div class="container" id="tela-ranking" style="display: none;">
        <h3 style="color: gold; text-align: center;">🏆 Hall da Fama Seguro</h3>
        <div id="lista-ranking"></div>
        <button class="btn-red" onclick="fecharRanking()">Voltar</button>
    </div>

    <script>
        // SEU LINK DO RENDER:
        const URL_API = "https://api-agente-ia-blwg.onrender.com/api";

        // DESAFIO HACKER: PERSISTÊNCIA (Verifica se já tem token ao apertar F5)
        window.onload = () => {
            const token = localStorage.getItem('token_saas');
            const nome = localStorage.getItem('nome_user');
            if (token && nome) {
                mostrarTelaJogo(nome);
            }
        };

        function mostrarTelaJogo(nome) {
            document.getElementById("tela-login").style.display = "none";
            document.getElementById("tela-jogo").style.display = "block";
            document.getElementById("nome-jogador").innerText = `👤 ${nome}`;
        }

        // FASE 6: Botão Sair (Desafio Hacker)
        function sairDaConta() {
            localStorage.removeItem('token_saas');
            localStorage.removeItem('nome_user');
            window.location.reload(); // Recarrega a página voltando pro Login
        }

        async function fazerCadastro() {
            const nome = document.getElementById("reg-nome").value;
            const email = document.getElementById("log-email").value;
            const senha = document.getElementById("log-senha").value;
            const msg = document.getElementById("msg-erro");

            const res = await fetch(`${URL_API}/auth/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nome, email, senha })
            });
            const dados = await res.json();
            
            if (res.ok) { msg.style.color = "green"; msg.innerText = "Cadastrado com sucesso! Agora clique em Entrar."; } 
            else { msg.style.color = "red"; msg.innerText = dados.erro; }
        }

        async function fazerLogin() {
            const email = document.getElementById("log-email").value;
            const senha = document.getElementById("log-senha").value;
            const msg = document.getElementById("msg-erro");

            const res = await fetch(`${URL_API}/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, senha })
            });
            const dados = await res.json();

            if (res.ok) {
                // FASE 6: Guardando o Crachá
                localStorage.setItem('token_saas', dados.token);
                localStorage.setItem('nome_user', dados.nome);
                mostrarTelaJogo(dados.nome);
            } else {
                msg.style.color = "red"; msg.innerText = dados.erro;
            }
        }

        async function enviar() {
            const input = document.getElementById("pergunta");
            const texto = input.value.trim();
            if (!texto) return;

            const historico = document.getElementById("historico");
            historico.innerHTML += `<div class="msg user">${texto}</div>`;
            input.value = "";
            historico.scrollTop = historico.scrollHeight;

            const token = localStorage.getItem('token_saas');

            try {
                const res = await fetch(`${URL_API}/chat`, {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}` // FASE 6: Enviando o Crachá
                    },
                    body: JSON.stringify({ pergunta: texto })
                });
                
                if (res.status === 401) { alert("Sessão expirada. Faça login novamente!"); sairDaConta(); return; }

                const dados = await res.json();
                historico.innerHTML += `<div class="msg bot">Guardião: ${dados.resposta}</div>`;
                historico.scrollTop = historico.scrollHeight;

                if (dados.resposta.toLowerCase().includes("acertou") || dados.resposta.toLowerCase().includes("parabéns")) {
                    confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
                }
            } catch (e) {
                historico.innerHTML += `<div class="msg bot" style="color: red;">Erro ao conectar.</div>`;
            }
        }

        async function verRanking() {
            const token = localStorage.getItem('token_saas');
            document.getElementById("tela-jogo").style.display = "none";
            document.getElementById("tela-ranking").style.display = "block";
            const lista = document.getElementById("lista-ranking");
            lista.innerHTML = "Carregando...";

            try {
                const res = await fetch(`${URL_API}/ranking`, {
                    headers: { "Authorization": `Bearer ${token}` }
                });
                
                if (res.status === 401) { alert("Não Autorizado!"); sairDaConta(); return; }

                const jogadores = await res.json();
                lista.innerHTML = jogadores.map((j, i) => {
                    let icone = i === 0 ? "🥇" : (i === 1 ? "🥈" : (i === 2 ? "🥉" : ""));
                    return `<div class="ranking-item">${icone} <b>${j.titulo}</b> <span>(${j.xp} XP)</span></div>`;
                }).join("");
            } catch (e) {
                lista.innerHTML = "Erro ao buscar ranking.";
            }
        }

        function fecharRanking() {
            document.getElementById("tela-ranking").style.display = "none";
            document.getElementById("tela-jogo").style.display = "block";
        }
    </script>
</body>
</html>
